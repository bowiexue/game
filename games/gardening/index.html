<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonsai Zen Sanctuary</title>
    <style>
        body { background: #f5f6fa; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px; color: #2f3640; }
        .nav-row { width: 100%; max-width: 450px; margin-bottom: 15px; }
        .back-btn { background: #7f8c8d; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .bonsai-box { background: white; border: 2px solid #ced6e0; border-radius: 20px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); text-align: center; }
        .tree-stage { font-size: 6rem; height: 130px; display: flex; align-items: center; justify-content: center; margin: 20px 0; transition: transform 0.2s; }
        .stat-bar { background: #f1f2f6; border-radius: 12px; height: 20px; margin: 10px 0; position: relative; overflow: hidden; border: 1px solid #dcdde1; }
        .fill { height: 100%; width: 0%; transition: width 0.3s; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .tool-btn { padding: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">⬅ Return to Map</button>
    </div>

    <div class="bonsai-box">
        <h2>🪴 Bonsai Zen Nursery</h2>
        <select id="genome-select" onchange="plantNewSeed()" style="margin-top:10px; padding:6px; border-radius:6px;">
            <option value="Juniper">🌲 Japanese Juniper Wood</option>
            <option value="Sakura">🌸 Cherry Blossom Sakura</option>
            <option value="Bamboo">🎋 Zen Stalk Bamboo</option>
        </select>

        <div class="tree-stage" id="bonsai-avatar">🌱</div>
        <h3 id="stage-lbl" style="color: #718093;">Sprout Phase</h3>

        <div>💧 Hydration Bar</div>
        <div class="stat-bar"><div id="water-fill" class="fill" style="background:#3498db;"></div></div>

        <div>✨ Soil Nutrient Density</div>
        <div class="stat-bar"><div id="fert-fill" class="fill" style="background:#2ecc71;"></div></div>

        <div class="btn-row">
            <button class="tool-btn" style="background:#2980b9;" onclick="actionTend('water')">Pour Water 💧</button>
            <button class="tool-btn" style="background:#27ae60;" onclick="actionTend('fert')">Add Fertilizer 🪱</button>
        </div>
    </div>

    <script>
        const genomes = {
            Juniper: ['🌱', '🌿', '🌲', '🌳'],
            Sakura: ['🌱', '🌿', '🌸', '💮'],
            Bamboo: ['🌱', '🎋', '🎍', '🎋']
        };
        let species = 'Juniper', water = 20, fertilizer = 20, stageIndex = 0;

        function updateNurseryUI() {
            document.getElementById('water-fill').style.width = `${water}%`;
            document.getElementById('fert-fill').style.width = `${fertilizer}%`;
            
            // Evaluate structural evolution thresholds
            stageIndex = Math.min(3, Math.floor((water + fertilizer) / 50));
            document.getElementById('bonsai-avatar').innerText = genomes[species][stageIndex];
            
            const labels = ['Sprout Node', 'Branching Cutting', 'Mature Nursery Core', 'Masterpiece Canopy'];
            document.getElementById('stage-lbl').innerText = labels[stageIndex];
        }

        function plantNewSeed() {
            species = document.getElementById('genome-select').value;
            water = 20; fertilizer = 20;
            updateNurseryUI();
        }

        function actionTend(type) {
            if(type === 'water') water = Math.min(100, water + 15);
            if(type === 'fert') fertilizer = Math.min(100, fertilizer + 15);
            
            // Add a little visual bounce animation when clicked
            const av = document.getElementById('bonsai-avatar');
            av.style.transform = 'scale(1.2)';
            setTimeout(() => av.style.transform = 'scale(1)', 200);
            
            updateNurseryUI();
        }

        updateNurseryUI();
    </script>
</body>
</html>
