<!DOCTYPE html>
<html lang="en">
    <!-- Reuses your existing cozy dashboard look -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Bonsai Laboratory</title>
    
    <!-- CLEAN STYLE OVERRIDE BLOCK (Ditches Courier completely) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Sharp, clean modern sans-serif arcade font cluster */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 800; /* Extra bold text for crisp button layouts */
            letter-spacing: -0.3px;
        }

        body {
            background: #fdfaf6;
            color: #3a2e2b;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-row {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn { 
            background: #3a2e2b; 
            color: #ffffff;
            border: 3px solid #3a2e2b;
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 #211917;
            transition: transform 0.1s;
        }
        .back-btn:active { transform: translateY(4px); box-shadow: none; }

        .cooking-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        .section-pantry {
            background: #ffffff;
            border: 4px solid #3a2e2b;
            border-radius: 12px;
            padding: 20px;
            height: 520px;
            overflow-y: auto;
        }

        .section-pantry h3 {
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 1.1rem;
            border-bottom: 3px solid #3a2e2b;
            padding-bottom: 8px;
        }

        .shelf-title {
            font-size: 0.8rem;
            margin-top: 15px;
            background: #faeed6;
            padding: 8px 10px;
            border-radius: 4px;
            border-left: 6px solid #3a2e2b;
            text-transform: uppercase;
        }

        .mode-toggle-btn {
            width: 100%;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 3px solid #3a2e2b;
            border-radius: 8px;
            cursor: pointer;
            background: #fdfdfd;
            color: #3a2e2b;
            box-shadow: 0 4px 0 #3a2e2b;
            margin-bottom: 6px;
            transition: all 0.05s ease-in-out;
        }
        .mode-toggle-btn:hover { background: #faeed6; }
        .mode-toggle-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #3a2e2b; }

        .section-kitchen {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .stove-and-tracker-row {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 20px;
            width: 100%;
        }

        .stove-station {
            background: #f5edd7;
            border: 4px solid #3a2e2b;
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .cook-btn {
            background: #38bdf8;
            color: #ffffff;
            border: 3px solid #3a2e2b;
            padding: 12px 24px;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 5px 0 #0284c7;
            transition: transform 0.1s;
        }
        .cook-btn:active { transform: translateY(5px); box-shadow: none; }

        .added-ingredients-tracker {
            background: #ffffff;
            border: 4px solid #3a2e2b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 520px;
        }
        .added-ingredients-tracker h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 3px solid #3a2e2b;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: center;
        }
    </style>
</head>

</head>
<body>

    <!-- CONTROL HEADER ROW -->
    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">◀ MAP HUB</button>
        <div style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">🪴 Greenhouse Module</div>
    </div>

    <!-- MAIN TWO COLUMN GRID SYSTEM -->
    <div class="cooking-grid">
        
        <!-- SIDEBAR MENU: 10 DISTINCT SEED SPECIMENS -->
        <aside class="section-pantry" style="height: 520px;">
            <h3>🌱 SEED REGISTRY</h3>
            
            <div class="shelf-title">Woodland Flora</div>
            <div class="ingredient-shelf" style="grid-template-columns: 1fr;">
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('pine')">🌲 Classic Pine</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('sakura')">🌸 Sakura Bloom</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('bamboo')">🎋 Jade Bamboo</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('shroom')">🍄 Canopy Shroom</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('fern')">🌿 Midnight Fern</button>
            </div>

            <div class="shelf-title" style="margin-top:15px;">Exotic & Aquatic</div>
            <div class="ingredient-shelf" style="grid-template-columns: 1fr;">
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('crystal')">💎 Prismatic Crystal</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('cactus')">🌵 Starburst Cactus</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('heliotrope')">🌻 Golden Heliotrope</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('thistle')">❄️ Frost Thistle</button>
                <button class="mode-toggle-btn" style="text-align:left; padding:8px 12px; margin-bottom:4px;" onclick="switchBonsaiSpecimen('coral')">🪸 Coral Fan</button>
            </div>
        </aside>

        <!-- MAIN GREENHOUSE COUNTERTOP WORKSPACE -->
        <div class="section-kitchen">
            <div class="stove-and-tracker-row" style="grid-template-columns: 1fr 260px;">
                
                <!-- Central Incubator Stand -->
                <main class="stove-station" style="height: 520px; background: #f0fdf4;">
                    <!-- Dynamically managed titles via code -->
                    <h2 id="plant-title-node" style="position:absolute; top:20px; text-transform:uppercase; font-size:1.1rem; letter-spacing:1px;">Classic Pine Bonsai</h2>
                    <h4 id="plant-stage-node" style="position:absolute; top:50px; font-size:0.75rem; color:#7f8c8d; letter-spacing:0.5px;">SPROUT</h4>

                    <!-- Vector Output Canvas Window Slot -->
                    <div id="bonsai-core-vector" style="width:140px; height:140px; margin-top:40px; margin-bottom:20px; transition:all 0.3s ease;">
                        <!-- Initial asset layer dynamically built by script -->
                    </div>

                    <!-- Care Interaction Input Row -->
                    <div style="display:flex; gap:15px; width:90%; justify-content:center; margin-top:20px;">
                        <button class="cook-btn" style="background:#38bdf8; box-shadow:0 5px 0 #0284c7; margin:0; padding:12px 20px; font-size:0.8rem;" onclick="waterPlant()">💧 WATER SOIL</button>
                        <button class="cook-btn" style="background:#fbbf24; box-shadow:0 5px 0 #b45309; margin:0; padding:12px 20px; font-size:0.8rem;" onclick="fertilizePlant()">🪱 FERTILIZE</button>
                    </div>
                </main>

                <!-- RIGHT PANEL: METRIC VITALS TRACKER -->
                <aside class="added-ingredients-tracker" style="height: 520px; padding:20px;">
                    <h4>📊 TELEMETRY METER</h4>

                    <div style="margin-top:25px;">
                        <div style="font-size:0.7rem; margin-bottom:6px; letter-spacing:0.5px;">💧 HYDRATION LEVELS</div>
                        <div style="width:100%; height:18px; background:#e2e8f0; border:3px solid var(--border-dark); border-radius:6px; overflow:hidden;">
                            <div id="hydration-bar" style="width:80%; height:100%; background:#38bdf8; transition:width 0.2s ease-out;"></div>
                        </div>
                    </div>

                    <div style="margin-top:25px;">
                        <div style="font-size:0.7rem; margin-bottom:6px; letter-spacing:0.5px;">🪱 NUTRIENT MATRIX</div>
                        <div style="width:100%; height:18px; background:#e2e8f0; border:3px solid var(--border-dark); border-radius:6px; overflow:hidden;">
                            <div id="nutrients-bar" style="width:80%; height:100%; background:#fbbf24; transition:width 0.2s ease-out;"></div>
                        </div>
                    </div>

                    <div style="margin-top:35px; border-top:3px dashed var(--border-dark); padding-top:25px; text-align:center;">
                        <div style="font-size:0.65rem; line-height:1.6; color:#7f8c8d; font-style:italic;">
                            Keep environmental vitals above 0% to fuel cell mutation. If soil dries out completely, growth pauses and your asset wilts gray.
                        </div>
                    </div>
                </aside>

            </div>
        </div>

    </div>

    <!-- Core Script Boot Linkage -->
    <script src="script.js"></script>
</body>
</html>
