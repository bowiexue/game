<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonsai & Plant Sanctuary</title>
    <style>
        :root {
            --bg: #f4f7f4;
            --dark: #2c3e50;
            --leaf: #6b8e23;
            --shelf: #d4a373;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--dark); padding: 25px; display: flex; flex-direction: column; align-items: center; transition: background 0.5s; }
        body.rainy { background: #b0bec5; }
        
        .sanctuary-box { background: white; padding: 25px; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); max-width: 700px; width: 100%; text-align: center; border: 4px solid #b8d8b8; }
        .back-btn { background: #718093; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; float: left; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; clear: both; }
        .rain-btn { background: #4a69bd; color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Plant Shelf Grid Matrix */
        .shelf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: #efe5d9; padding: 20px; border-radius: 16px; border-bottom: 12px solid var(--shelf); }
        .pot-node { background: rgba(255,255,255,0.7); border: 3px dashed #bdc3c7; border-radius: 16px; padding: 15px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        
        .plant-look { font-size: 3.5rem; cursor: pointer; user-select: none; transition: transform 0.2s; }
        .plant-look:hover { transform: scale(1.1); }
        
        .water-btn { background: #29b6f6; color: white; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="sanctuary-box">
        <button class="back-btn" onclick="location.href='../../index.html'">⬅ Map</button>
        <h2 style="color: var(--leaf);">🪴 Bonsai Propagation Sanctuary</h2>
        
        <div class="header-row">
            <span style="font-weight: bold; color: #7f8c8d;">Tap an empty pot to propagate a shoot.</span>
            <button class="rain-btn" onclick="toggleRain()">🌧️ Rainy Day Mode</button>
        </div>

        <div class="shelf-grid">
            <div class="pot-node" id="pot-0">
                <div class="plant-look" onclick="plantSeed(0)">🏺</div>
                <div style="font-size:0.85rem; font-weight:bold;" id="label-0">Empty Pot</div>
                <button class="water-btn" onclick="waterPlant(0)">💧 Water</button>
            </div>
            <div class="pot-node" id="pot-1">
                <div class="plant-look" onclick="plantSeed(1)">🏺</div>
                <div style="font-size:0.85rem; font-weight:bold;" id="label-1">Empty Pot</div>
                <button class="water-btn" onclick="waterPlant(1)">💧 Water</button>
            </div>
            <div class="pot-node" id="pot-2">
                <div class="plant-look" onclick="plantSeed(2)">🏺</div>
                <div style="font-size:0.85rem; font-weight:bold;" id="label-2">Empty Pot</div>
                <button class="water-btn" onclick="waterPlant(2)">💧 Water</button>
            </div>
        </div>
    </div>

    <script>
        // BROWSER STORAGE SYNCHRONIZATION 
        let garden = [
            { stage: 0, wateredTime: Date.now() },
            { stage: 0, wateredTime: Date.now() },
            { stage: 0, wateredTime: Date.now() }
        ];

        if(localStorage.getItem('cozy_bonsai_save')) {
            garden = JSON.parse(localStorage.getItem('cozy_bonsai_save'));
            
            // Checks if real time has passed since last opening to simulate automated background growth
            garden.forEach(p => {
                if(p.stage > 0 && p.stage < 3) {
                    p.stage++; // Grow automatically upon returning the next day!
                }
            });
        }

        function saveGame() {
            localStorage.setItem('cozy_bonsai_save', JSON.stringify(garden));
            render();
        }

        const assets_icons = ['🏺', '🌱', '🌿', '🪴'];
        const assets_labels = ['Empty Clay Pot', 'Tiny Seed Sprout', 'Growing Bonsai', 'Mature Masterpiece!'];

        function render() {
            garden.forEach((p, index) => {
                document.querySelector(`#pot-${index} .plant-look`).innerText = assets_icons[p.stage];
                document.getElementById(`label-${index}`).innerText = assets_labels[p.stage];
            });
        }

        function plantSeed(index) {
            if(garden[index].stage === 0) {
                garden[index].stage = 1;
                garden[index].wateredTime = Date.now();
                saveGame();
            }
        }

        function waterPlant(index) {
            if(garden[index].stage > 0 && garden[index].stage < 3) {
                garden[index].stage++;
                garden[index].wateredTime = Date.now();
                saveGame();
                alert("The leaves look crisp and healthy after watering! 🍃");
            }
        }

        function toggleRain() {
            document.body.classList.toggle('rainy');
        }

        render();
    </script>
</body>
</html>
