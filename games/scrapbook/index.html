<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Diorama Room Decorator</title>
    <style>
        body { background: #ebf3f5; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 25px; }
        .container { display: grid; grid-template-columns: 260px 1fr; gap: 25px; max-width: 950px; width: 100%; }
        
        /* Left Inventory Sidebar */
        .picker-panel { background: white; border: 2px solid #b2bec3; border-radius: 16px; padding: 20px; }
        .item-category-title { font-weight: bold; margin: 15px 0 8px 0; color: #636e72; font-size: 0.9rem; }
        .sticker-tray { display: flex; gap: 10px; flex-wrap: wrap; }
        .sticker-node { font-size: 2.2rem; background: #f1f2f6; border: none; border-radius: 8px; width: 55px; height: 55px; cursor: grab; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
        .sticker-node:hover { transform: scale(1.1); background: #dfe4ea; }

        /* Right Room Canvas Board Workspace */
        .canvas-board { background: #ffeaa7; border: 8px solid #d63031; border-radius: 20px; height: 480px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.06); overflow: hidden; }
        .room-floor { position: absolute; bottom: 0; width: 100%; height: 35%; background: #fab1a0; border-top: 4px solid #ff7675; }
        
        .placed-furniture { position: absolute; font-size: 3.5rem; cursor: move; user-select: none; transform: translate(-50%, -50%); z-index: 10; }
        
        .radio-station { background: #2d3436; color: #00cec9; padding: 12px; border-radius: 12px; margin-top: 15px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; }
    </style>
</head>
<body>

    <h1 style="color: #d63031; margin-bottom: 20px;">🧺 Custom Lofi Room Decorator</h1>

    <div class="container">
        <!-- Sidebar item tray asset container -->
        <aside class="picker-panel">
            <h3>🗄️ Item Inventory</h3>
            
            <div class="item-category-title">🛋️ Comfort Items</div>
            <div class="sticker-tray">
                <button class="sticker-node" onclick="spawnSticker('🪟')">🪟</button>
                <button class="sticker-node" onclick="spawnSticker('🛋️')">🛋️</button>
                <button class="sticker-node" onclick="spawnSticker('🪑')">🪑</button>
                <button class="sticker-node" onclick="spawnSticker('🛏️')">🛏️</button>
            </div>

            <div class="item-category-title">🪴 Aesthetic Accents</div>
            <div class="sticker-tray">
                <button class="sticker-node" onclick="spawnSticker('🪴')">🪴</button>
                <button class="sticker-node" onclick="spawnSticker('📚')">📚</button>
                <button class="sticker-node" onclick="spawnSticker('🐱')">🐱</button>
                <button class="sticker-node" onclick="spawnSticker('📺')">📺</button>
            </div>

            <!-- Integrated Radio Interface Block -->
            <div class="item-category-title">📻 Room Radio Station</div>
            <div class="radio-station">
                <span>🎵 Lofi Chill Beats</span>
                <button style="background:#00cec9; border:none; padding:4px 8px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="toggleRadio(this)">PLAY</button>
            </div>
            <audio id="lofi-stream" loop src="https://streamguys1.com"></audio>
        </aside>

        <!-- Room workspace playground area panel -->
        <main class="canvas-board" id="canvas-room">
            <div class="room-floor"></div>
            <!-- Dynamic elements spawn freely here without row limits -->
        </main>
    </div>

    <script>
        let isPlaying = false;
        function toggleRadio(btn) {
            const track = document.getElementById('lofi-stream');
            if(!isPlaying) { track.play().catch(()=>{}); btn.innerText = "STOP"; btn.style.background="#ff7675"; }
            else { track.pause(); btn.innerText = "PLAY"; btn.style.background="#00cec9"; }
            isPlaying = !isPlaying;
        }

        function spawnSticker(emoji) {
            const canvas = document.getElementById('canvas-room');
            const item = document.createElement('div');
            item.classList.add('placed-furniture');
            item.innerText = emoji;
            
            // Spawn items neatly centered in the upper living space area initially
            item.style.left = "50%";
            item.style.top = "40%";

            // Enable intuitive canvas spatial drag and drop event handling
            let isDragging = false;
            item.addEventListener('mousedown', (e) => { isDragging = true; item.style.zIndex = 100; });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const bounds = canvas.getBoundingClientRect();
                let x = e.clientX - bounds.left;
                let y = e.clientY - bounds.top;
                
                // Keep objects bound securely within workspace margins
                if (x >= 0 && x <= bounds.width) item.style.left = `${x}px`;
                if (y >= 0 && y <= bounds.height) item.style.top = `${y}px`;
            });

            document.addEventListener('mouseup', () => { isDragging = false; item.style.zIndex = 10; });
            
            // Double click deletion handler
            item.addEventListener('dblclick', () => item.remove());

            canvas.appendChild(item);
        }
    </script>
</body>
</html>
