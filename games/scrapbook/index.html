<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Room Studio</title>
    <!-- SECTION 1 INTERACTION HOOK -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">◀ RETURN TO MAP HUB</button>
        <span style="font-weight: bold;">🪙 SHOP WALLET: <span id="local-tokens">100</span></span>
    </div>

    <!-- The 2 Side-by-Side Sections Layout Container -->
    <div class="main-workspace-grid">
        <!-- LEFT COLUMN SECTION -->
        <aside class="section-sidebar">
            <h3>🗄️ FURNITURE DESK</h3>
            <div class="cat-title">🛏️ Beds & Mats</div><div class="item-grid" id="grid-beds"></div>
            <div class="cat-title">🛋️ Living Seating</div><div class="item-grid" id="grid-seating"></div>
            <div class="cat-title">🪑 Framework Tables</div><div class="item-grid" id="grid-tables"></div>
            <div class="cat-title">🖥️ Tech & Lamps</div><div class="item-grid" id="grid-electronics"></div>
            <div class="cat-title">🪴 Custom Foliage</div><div class="item-grid" id="grid-plants"></div>
            <div class="cat-title">🧸 Companion Plush</div><div class="item-grid" id="grid-plush"></div>
        </aside>
        <!-- RIGHT COLUMN SECTION -->
        <main class="section-canvas" id="canvas"><div class="floor"></div></main>
    </div>

    <div class="tips-bar">[ DRAG ASSETS TO PLACE IN CANVAS • HOVER TO SCALE OBJECTS VIA + / - CONTROLS • DBLCLICK TO DELETE ]</div>

    <!-- SECTION 2 INTERACTION HOOK -->
    <script src="script.js"></script>
