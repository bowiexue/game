<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Lo-Fi Room Decorator</title>
    <style>
        :root {
            --cozy-blue: #dfe6e9;
            --cozy-dark: #2d3436;
            --shelf-color: #fab1a0;
        }
        * { box-sizing: border-box; font-family: 'Century Gothic', sans-serif; margin: 0; padding: 0; }
        body { background: #f5f6fa; color: var(--cozy-dark); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .diorama-frame { background: white; border: 4px solid var(--cozy-dark); border-radius: 24px; padding: 20px; max-width: 950px; width: 100%; box-shadow: 0 10px 0 var(--cozy-dark); }
        .back-btn { background: #718093; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; float: left; margin-bottom: 15px; }
        
        /* Audio Radio Player interface */
        .radio-deck { background: #ffeaa7; border: 3px solid var(--cozy-dark); border-radius: 12px; padding: 10px 20px; display: flex; align-items: center; gap: 15px; width: fit-content; float: right; margin-bottom: 15px; }
        .radio-btn { background: white; border: 2px solid var(--cozy-dark); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        .workspace-split { display: grid; grid-template-columns: 1fr 280px; gap: 20px; clear: both; }
        
        /* Cozy Studio Bedroom Diorama Space Layout */
        .room-canvas { background: #ffeaa7; border: 4px solid var(--cozy-dark); border-radius: 16px; height: 480px; position: relative; overflow: hidden; background-image: linear-gradient(rgba(0,0,0,0.03) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.03) 2px, transparent 2px); background-size: 20px 20px; }
        
        /* Isometric Furniture Placement Backdrops */
        .bed-base { position: absolute; bottom: 20px; left: 30px; width: 220px; height: 90px; background: #a29bfe; border: 4px solid var(--cozy-dark); border-radius: 12px 12px 4px 4px; box-shadow: inset 0 15px 0 #74b9ff; }
        .pillow { position: absolute; top: 10px; left: 10px; width: 50px; height: 35px; background: white; border: 3px solid var(--cozy-dark); border-radius: 6px; }
        .desk-base { position: absolute; bottom: 20px; right: 40px; width: 180px; height: 80px; background: #ffeaa7; border: 4px solid var(--cozy-dark); border-radius: 8px; border-bottom: none; box-shadow: inset 0 12px 0 #fab1a0; }
        .shelf-base { position: absolute; top: 100px; left: 80px; width: 260px; height: 20px; background: var(--shelf-color); border: 3px solid var(--cozy-dark); border-radius: 4px; }

        /* Item Sidebar Inventory Sheet */
        .sidebar { background: #f1f2f6; border: 4px solid var(--cozy-dark); border-radius: 16px; padding: 15px; height: 480px; overflow-y: auto; }
        .sidebar h3 { font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; background: #55efc4; display: inline-block; padding: 2px 8px; border-radius: 6px; border: 2px solid var(--cozy-dark); }
        
        .item-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .picker-node { background: white; border: 2px solid var(--cozy-dark); border-radius: 12px; padding: 10px; text-align: center; font-size: 2rem; cursor: grab; user-select: none; box-shadow: 0 4px 0 var(--cozy-dark); }
        .picker-node:active { cursor: grabbing; }
        
        .placed-furniture { position: absolute; font-size: 2.8rem; cursor: move; user-select: none; z-index: 10; line-height: 1; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="diorama-frame">
        <button class="back-btn" onclick="location.href='../../index.html'">⬅ Hub</button>
        
        <!-- LO-FI RADIO INTERACTIVE CONTROLS -->
        <div class="radio-deck">
            <span>📻 <strong>Lo-Fi Audio Player:</strong> <span id="radio-track-title">Chill Station</span></span>
            <button class="radio-btn" id="audio-toggle-btn" onclick="toggleRadio()">▶</button>
        </div>

        <h2 style="clear:both; padding-top:10px; font-size:1.8rem; margin-bottom:5px;">🧺 Lo-Fi Diorama Decorator</h2>
        <p style="font-size:0.85rem; color:#718093; margin-bottom:20px;">Open the catalog deck, click and drag items onto shelves or desks, or double-click an item to remove it!</p>

        <div class="workspace-split">
            <!-- THE ROOM BACKDROP WORKSPACE -->
            <div class="room-canvas" id="room-canvas">
                <!-- Wall Shelves & Bed anchors -->
                <div class="shelf-base"></div>
                <div class="bed-base"><div class="pillow"></div></div>
                <div class="desk-base"></div>
            </div>

            <!-- SIDEBAR ITEM INVENTORY CATALOG -->
            <div class="sidebar">
                <h3>🛋️ Sprites Deck</h3>
                <div class="item-picker-grid">
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">📚</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">🧸</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">🪴</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">🐱</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">🕯️</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">💡</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">📻</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">🍵</div>
                    <div class="picker-node" draggable="true" ondragstart="drag(event)">🎨</div>
                </div>
            </div>
        </div>
    </div>

    <!-- WEB AUDIO SYNTH BACKGROUND BEATS PLAYER -->
    <script>
        const canvas = document.getElementById('room-canvas');

        // Drag and Drop Placement Loops
        function drag(ev) {
            ev.dataTransfer.setData("sprite", ev.target.innerText);
        }

        canvas.addEventListener('dragover', (e) => e.preventDefault());
        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const emoji = e.dataTransfer.getData("sprite");
            const rect = canvas.getBoundingClientRect();
            
            // Compute inner coordinate positions safely
            const leftX = e.clientX - rect.left - 20;
            const topY = e.clientY - rect.top - 20;
            
            spawnItemNode(emoji, leftX, topY);
        });

        function spawnItemNode(emoji, left, top) {
            if(!emoji) return;
            const item = document.createElement('div');
            item.className = 'placed-furniture';
            item.innerText = emoji;
            item.style.left = left + 'px';
            item.style.top = top + 'px';

            let moveActive = false;
            item.addEventListener('mousedown', (e) => {
                moveActive = true;
                e.stopPropagation();
            });

            window.addEventListener('mousemove', (e) => {
                if(!moveActive) return;
                const rect = canvas.getBoundingClientRect();
                item.style.left = (e.clientX - rect.left - 20) + 'px';
                item.style.top = (e.clientY - rect.top - 20) + 'px';
            });

            window.addEventListener('mouseup', () => moveActive = false);
            
            // Double click trigger elements wipes item completely
            item.addEventListener('dblclick', () => item.remove());
            
            canvas.appendChild(item);
        }

        // WEB AUDIO CONSOLE CHILL SYNTH GENERATOR LOOPS
        let audioCtx = null;
        let oscillator = null;
        let isPlaying = false;

        function toggleRadio() {
            const btn = document.getElementById('audio-toggle-btn');
            if(!isPlaying) {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create an ultra-low frequency cozy sub-ambient drone synth oscillator block
                oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                oscillator.type = 'triangle'; 
                oscillator.frequency.setValueAtTime(98.00, audioCtx.currentTime); // Deep warm G2 lofi root pitch key node
                
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime); // Low whisper volume line levels
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                
                btn.innerText = '■';
                document.getElementById('radio-track-title').innerText = "Lo-Fi Lullaby Ambient Drone";
                isPlaying = true;
            } else {
                if(oscillator) {
                    oscillator.stop();
                    oscillator.disconnect();
                }
                btn.innerText = '▶';
                document.getElementById('radio-track-title').innerText = "Radio Muted";
                isPlaying = false;
            }
        }
    </script>
</body>
</html>
