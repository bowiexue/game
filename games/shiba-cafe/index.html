<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Onsen Designer</title>
    <!-- Links your overhauled cozy Japanese spa stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAV HEADER ROW -->
    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">◀ MAP HUB</button>
    </div>

    <!-- MAIN TWO COLUMN ARCADE INTERFACE CABINET -->
    <div class="game-layout">
        
        <!-- LEFT PANEL: CUSTOM SUITE AVATAR ASSEMBLY -->
        <section class="card-section">
            <h2>🦫 ONSEN DESIGNER</h2>
            
            <!-- STACKED ABSOLUTE COORDINATES GRAPHICS WINDOW -->
            <div class="avatar-display-box" id="avatar-sandbox">
                <!-- ACCESSORIES ELEMENT MESHES -->
                <div class="overlay-layer id-head" id="layer-head"></div>
                <div class="overlay-layer id-glass" id="layer-glass"></div>
                
                <div class="base-avatar">🦫</div>
            </div>

            <div class="item-category">
                <div class="category-title">👒 HEADWEAR SELECT</div>
                <div class="options-row">
                    <button class="option-node" onclick="setLayer('head', '👑')">👑</button>
                    <button class="option-node" onclick="setLayer('head', '🎀')">🎀</button>
                    <button class="option-node" onclick="setLayer('head', '🎩')">🎩</button>
                    <button class="option-node remove-btn" onclick="setLayer('head', '')">❌</button>
                </div>
            </div>

            <div class="item-category">
                <div class="category-title">👓 GLASSES ACCENTS</div>
                <div class="options-row">
                    <button class="option-node" onclick="setLayer('glass', '🕶️')">🕶️</button>
                    <button class="option-node" onclick="setLayer('glass', '🤓')">🤓</button>
                    <button class="option-node remove-btn" onclick="setLayer('glass', '')">❌</button>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: DISPATCH COMFORT PACK SYSTEM -->
        <section class="card-section">
            <h2>🧺 COMFORT DISPATCH</h2>
            
            <div class="item-category">
                <div class="category-title">📦 CHOOSE COZY ADD-ONS</div>
                <div class="button-grid">
                    <button class="grid-item-btn" onclick="addToBasket('🍊 Yuzu')">🍊 Yuzu</button>
                    <button class="grid-item-btn" onclick="addToBasket('🧼 Salts')">🧼 Salts</button>
                    <button class="grid-item-btn" onclick="addToBasket('🧣 Towel')">🧣 Towel</button>
                    <button class="grid-item-btn" onclick="addToBasket('🍵 Tea')">🍵 Tea</button>
                </div>
            </div>

            <div class="item-category" style="margin-top:10px;">
                <div class="category-title">📋 CURRENT SELECTIONS</div>
                <div class="basket-status-box" id="basket-view-container">
                    <span id="basket-view">Empty Basket</span>
                </div>
            </div>

            <div>
                <button class="action-btn success" onclick="compilePotRecipe()">PREPARE TREATMENT ♨</button>
                <button class="action-btn danger" onclick="clearStockpot()">CLEAR BASKET 🗑️</button>
            </div>
        </section>

    </div>

    <!-- Core Loop script loader -->
    <script src="script.js"></script>
</body>
</html>
