<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toca Shiba World Cafe</title>
    <style>
        :root {
            --toca-bg: #ffefdb;
            --toca-panel: #ffffff;
            --toca-accent: #ff6b81;
            --toca-text: #4a4a4a;
        }
        * { box-sizing: border-box; font-family: 'Fredoka One', 'Comic Sans MS', sans-serif; margin: 0; padding: 0; }
        body { background: #a29bfe; color: var(--toca-text); padding: 25px; display: flex; flex-direction: column; align-items: center; }
        
        .toca-box { background: var(--toca-bg); padding: 30px; border-radius: 32px; box-shadow: 0 12px 0px rgba(0,0,0,0.1); max-width: 900px; width: 100%; border: 6px solid #4a4a4a; }
        .back-btn { background: #ff7675; color: white; border: 4px solid #4a4a4a; padding: 8px 16px; border-radius: 16px; font-weight: bold; cursor: pointer; float: left; box-shadow: 0 4px 0 #4a4a4a; }
        .back-btn:active { transform: translateY(4px); box-shadow: none; }

        .studio-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; margin-top: 20px; clear: both; }
        .pane { background: var(--toca-panel); border: 5px solid #4a4a4a; border-radius: 24px; padding: 20px; box-shadow: inset 0 -6px 0 #dfe6e9; }
        
        /* Fixed Vector Coordinate Layer Mapping */
        .avatar-stage { background: #ffeaa7; height: 260px; border-radius: 20px; border: 4px solid #4a4a4a; position: relative; display: flex; align-items: center; justify-content: center; }
        .shiba-body { font-size: 8rem; position: relative; z-index: 1; user-select: none; }
        
        /* Pixels lock hats and shirts flush with face geometry coordinates */
        .hat-layer { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 3.5rem; z-index: 3; pointer-events: none; }
        .cloth-layer { position: absolute; bottom: 45px; left: 50%; transform: translateX(-40%); font-size: 4rem; z-index: 2; pointer-events: none; }
        .face-layer { position: absolute; top: 105px; left: 52%; transform: translateX(-50%); font-size: 1.8rem; z-index: 4; pointer-events: none; }

        .toca-title { font-size: 1.3rem; margin: 15px 0 8px 0; text-align: left; background: #55efc4; display: inline-block; padding: 4px 12px; border-radius: 12px; border: 3px solid #4a4a4a; }
        .opt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .opt-node { background: #f1f2f6; border: 3px solid #4a4a4a; border-radius: 16px; padding: 10px; cursor: pointer; font-size: 2rem; box-shadow: 0 4px 0 #4a4a4a; text-align: center; }
        .opt-node:active { transform: translateY(4px); box-shadow: none; }
        
        /* Kitchen Playground Scene Layout */
        .cafe-floor { background: #74b9ff; height: 260px; border-radius: 20px; position: relative; border: 5px solid #4a4a4a; background-image: radial-gradient(rgba(255,255,255,0.3) 15%, transparent 16%); background-size: 16px 16px; }
        .guest-shiba { position: absolute; bottom: 80px; left: 35px; font-size: 6rem; }
        .serving-plate { position: absolute; bottom: 85px; right: 55px; font-size: 3.5rem; border: 4px dashed #fff; border-radius: 50%; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); }
        
        .counter-table { position: absolute; bottom: 0; width: 100%; height: 75px; background: #fab1a0; border-top: 5px solid #4a4a4a; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .food-asset { cursor: grab; font-size: 2.5rem; transition: transform 0.1s; }
        .food-asset:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div class="toca-box">
        <button class="back-btn" onclick="location.href='../../index.html'">⬅ Map</button>
        <h2 style="font-size: 2.2rem; text-shadow: 2px 2px 0px #fff; margin-bottom: 5px;">🏡 Toca Shiba Cafe Studio</h2>
        
        <div class="studio-layout">
            <!-- PANE 1: CHARACTER CREATOR CLOSET -->
            <div class="pane">
                <div class="avatar-stage">
                    <div class="shiba-body">🐕</div>
                    <div class="hat-layer" id="layer-hat"></div>
                    <div class="face-layer" id="layer-face">🕶️</div>
                    <div class="cloth-layer" id="layer-cloth"></div>
                </div>

                <div class="toca-title">👑 Head Accessories</div>
                <div class="opt-grid" onclick="cosmetic('hat', event)">
                    <div class="opt-node">👑</div><div class="opt-node">🎀</div><div class="opt-node">🎩</div><div class="opt-node">❌</div>
                </div>

                <div class="toca-title">🕶️ Expressions</div>
                <div class="opt-grid" onclick="cosmetic('face', event)">
                    <div class="opt-node">🕶️</div><div class="opt-node">🤓</div><div class="opt-node">😭</div><div class="opt-node">❌</div>
                </div>

                <div class="toca-title">👔 Outfits & Capes</div>
                <div class="opt-grid" onclick="cosmetic('cloth', event)">
                    <div class="opt-node">👔</div><div class="opt-node">👗</div><div class="opt-node">🎒</div><div class="opt-node">❌</div>
                </div>
            </div>

            <!-- PANE 2: THE PLAYGROUND SERVICE KITCHEN -->
            <div class="pane" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h3 style="font-size:1.6rem; margin-bottom: 5px;">🍳 Dining Sandbox</h3>
                    <p style="font-size:0.9rem; color:#636e72;">Drag treats directly off the food deck onto the plate to serve your guest!</p>
                </div>

                <div class="cafe-floor">
                    <div class="guest-shiba">🦊</div>
                    <div class="serving-plate" id="drop-plate">🍽️</div>
                    
                    <div class="counter-table">
                        <span class="food-asset" draggable="true" ondragstart="drag(event)">🥞</span>
                        <span class="food-asset" draggable="true" ondragstart="drag(event)">🍰</span>
                        <span class="food-asset" draggable="true" ondragstart="drag(event)">🍦</span>
                        <span class="food-asset" draggable="true" ondragstart="drag(event)">🍔</span>
                    </div>
                </div>

                <button onclick="shuffleGuest()" style="width:100%; padding:12px; background:#55efc4; border:4px solid #4a4a4a; border-radius:16px; font-weight:bold; font-size:1.1rem; cursor:pointer; box-shadow: 0 4px 0 #4a4a4a;">Invite Next Customer</button>
            </div>
        </div>
    </div>

    <script>
        function cosmetic(layer, e) {
            if(!e.target.classList.contains('opt-node')) return;
            const selection = e.target.innerText;
            document.getElementById(`layer-${layer}`).innerText = (selection === '❌') ? '' : selection;
        }

        function drag(ev) { ev.dataTransfer.setData("foodItem", ev.target.innerText); }
        
        const plate = document.getElementById('drop-plate');
        plate.addEventListener('dragover', (e) => e.preventDefault());
        plate.addEventListener('drop', (e) => {
            e.preventDefault();
            plate.innerText = e.dataTransfer.getData("foodItem");
            plate.style.borderStyle = "solid";
        });

        const characters = ['🦊', '🐱', '🦁', '🐻', '🐶', '🐮', '🐼', '🐰', '🐷', '🐹', '🐯'];
        function shuffleGuest() {
            document.querySelector('.guest-shiba').innerText = characters[Math.floor(Math.random() * characters.length)];
            plate.innerText = '🍽️';
            plate.style.borderStyle = "dashed";
        }
    </script>
</body>
</html>
