<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Onsen Designer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">⬅ Return to Map</button>
    </div>

    <div class="game-layout">
        <!-- LEFT COLUMN: AVATAR STUDIO -->
        <section class="card-section">
            <h2>🦫 Avatar Designer</h2>
            
            <div class="item-category">
                <div class="category-title">👒 Headwear</div>
                <div class="options-row">
                    <button class="option-node" onclick="setLayer('head', '👑')">👑</button>
                    <button class="option-node" onclick="setLayer('head', '🎀')">🎀</button>
                    <button class="option-node" onclick="setLayer('head', '🎩')">🎩</button>
                    <button class="option-node remove-btn" onclick="setLayer('head', '')">❌</button>
                </div>
            </div>

            <div class="item-category">
                <div class="category-title">👓 Glasses</div>
                <div class="options-row">
                    <button class="option-node" onclick="setLayer('glass', '🕶️')">🕶️</button>
                    <button class="option-node" onclick="setLayer('glass', '🤓')">🤓</button>
                    <button class="option-node remove-btn" onclick="setLayer('glass', '')">❌</button>
                </div>
            </div>

            <div class="avatar-display-box">
                <div class="base-avatar">
                    🦫
                    <div id="layer-head" class="overlay-layer layer-head"></div>
                    <div id="layer-glass" class="overlay-layer layer-glass"></div>
                </div>
            </div>

            <button class="action-btn success">Done! Enter Onsen ♨️</button>
        </section>

        <!-- RIGHT COLUMN: SPA PREPARATION DESK -->
        <section class="card-section">
            <h2>🧺 Select Comfort Items</h2>
            
            <div class="button-grid">
                <button class="grid-item-btn" onclick="addToBasket('🍊 Yuzu Fruit')">🍊 Yuzu Fruit</button>
                <button class="grid-item-btn" onclick="addToBasket('🧼 Bath Salts')">🧼 Bath Salts</button>
                <button class="grid-item-btn" onclick="addToBasket('🧣 Hot Towel')">🧣 Hot Towel</button>
                <button class="grid-item-btn" onclick="addToBasket('🍵 Green Tea')">🍵 Green Tea</button>
            </div>

            <button class="action-btn danger" onclick="clearBasket()">Clear Basket 🗑️</button>
            
            <h2 style="margin-top:20px; font-size:1.1rem;">Spa Preparation Desk</h2>
            <div id="basket-view" class="basket-status">Empty Basket</div>

            <button class="action-btn success" onclick="alert('Treatment Prepared!')">Prepare Treatment ♨️</button>
        </section>
    </div>

    <script>
        let basket = [];
        function setLayer(layer, emoji) {
            document.getElementById(`layer-${layer}`).innerText = emoji;
        }
        function addToBasket(item) {
            if(!basket.includes(item)) basket.push(item);
            updateBasketUI();
        }
        function clearBasket() {
            basket = [];
            updateBasketUI();
        }
        function updateBasketUI() {
            const el = document.getElementById('basket-view');
            el.innerText = basket.length > 0 ? basket.join(', ') : 'Empty Basket';
        }
    </script>
</body>
</html>
