<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Bakery: Cake Tower Stack</title>
    <!-- Links your overhauled arcade cabinet stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVIGATION CONSOLE HEADER -->
    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">◀ MAP HUB</button>
    </div>

    <!-- MAIN DUAL-PANEL CONSOLE CABINET CHASSIS -->
    <div class="game-box">
        
        <!-- LEFT PANEL: THE HIGH-SPEED CRT VIEWSCREEN LAYER -->
        <div class="left-screen-bay">
            
            <!-- Real-Time Score Metrics Display Readout -->
            <div class="order-ticket">
                <div style="font-size:0.9rem; color:#ffb6c1; margin-bottom:4px; font-weight:900; text-align:center;">🍥 CONSOLE TELEMETRY MATRIX 🍥</div>
                <div style="display: flex; justify-content: space-between; font-size: 1.5rem;">
                    <span>🎂 TOWER HEIGHT: <span id="score-val">0</span></span>
                    <span>👑 STREAK: <span id="combo-val">0</span></span>
                </div>
            </div>

            <!-- THE CORE BAKERY PHYSICS STACKING CANVAS BASEMENT -->
            <div class="cup-container" id="game-viewport">
                <!-- Moving Claw Crane Line -->
                <div id="crane-claw-wire" style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #5c4a45;"></div>
                
                <!-- The Active Sliding Piece Grid -->
                <div id="active-sliding-slice" style="position: absolute; top: 4px; height: 16px; background: #ffb7b2; border: 2px solid #5c4a45; border-radius: 4px; box-shadow: inset 0 3px 0 #fff;"></div>
                
                <!-- Anchored Tower Placement Ground Stack Element -->
                <div id="tower-anchor-stack" style="position: absolute; bottom: 0; width: 100%; height: 100%; pointer-events: none;"></div>
            </div>

            <!-- Terminal alert status display feedback ribbons -->
            <div id="blend-status-banner">🍬 PRESS SPACEBAR OR CLICK TO DROP SLICE!</div>
            
        </div>

        <!-- RIGHT PANEL: GAMEPLAY LEVER CONTROLS & LIFETIME JOURNAL -->
        <div class="right-control-bay">
            
            <!-- Massive Kinetic Drop Trigger Switch (Alternative to hitting Spacebar) -->
            <button class="action-btn success" id="master-drop-trigger-btn" style="height: 120px; font-size: 2.2rem; box-shadow: 0 10px 0 #89bd9e;">
                🕹️ DROP SLICE!
            </button>

            <!-- CONSOLE SHOP METRIC LOG BOOK -->
            <div class="added-ingredients-tracker" style="flex-grow: 1; min-height: 250px;">
                <div style="font-size: 1.1rem; border-bottom: 2px dashed #735d57; padding-bottom: 4px; margin-bottom: 8px; text-align:center; font-weight:900;">📖 BAKERY MILESTONE JOURNAL</div>
                <div id="tracker-pills-list" style="font-size: 1.2rem; line-height: 1.4; display: flex; flex-direction: column; gap: 6px;">
                    <div class="tracker-item-row">✨ Standard Record: 0 Floors</div>
                    <div class="tracker-item-row">🍓 Sweet Strawberry: Locked</div>
                    <div class="tracker-item-row">🍵 Matcha Shogun: Locked</div>
                </div>
            </div>

        </div>

    </div>

    <!-- Core Runtime Physics Engine Script Loader -->
    <script src="script.js"></script>
</body>
</html>
