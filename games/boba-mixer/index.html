<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Boba Lab</title>
    <style>
        :root { --bg: #fbf7f0; --ui-frame: #2d3436; --text: #2d3436; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background: var(--bg); color: var(--text); padding: 25px; display: flex; flex-direction: column; align-items: center; }
        .nav-row { width: 100%; max-width: 500px; margin-bottom: 12px; }
        .back-btn { background: var(--ui-frame); color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .game-box { background: white; border: 4px solid var(--ui-frame); border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 6px 0 rgba(0,0,0,0.05); text-align: center; }
        .order-ticket { background: #fffdf3; border: 3px dashed #f39c12; border-radius: 6px; padding: 12px; margin-bottom: 15px; font-weight: bold; text-align: left; font-size: 0.9rem; }
        .cup-container { width: 130px; height: 180px; border: 4px solid var(--ui-frame); border-top: none; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; margin: 15px auto; position: relative; background: #fff; overflow: hidden; }
        .liquid { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; transition: height 0.4s, background-color 0.4s; opacity: 0.9; z-index: 1; }
        .boba-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .pixel-garnish { position: absolute; width: 16px; height: 16px; transform: translate(-50%, -50%); }
        .pixel-garnish svg { width: 100%; height: 100%; image-rendering: pixelated; }
        .tabs { display: flex; gap: 4px; margin-bottom: 12px; background: #f1f2f6; padding: 4px; border-radius: 6px; border: 3px solid var(--ui-frame); }
        .tab-btn { flex: 1; padding: 8px 4px; background: none; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 0.8rem; color: var(--text); }
        .tab-btn.active { background: var(--ui-frame); color: white; }
        .ingredients-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .ing-btn { background: #fafafa; border: 3px solid var(--ui-frame); padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .ing-btn:hover { background: #fffde7; }
        .action-bar { margin-top: 15px; display: flex; gap: 8px; }
        .action-bar button { flex: 1; padding: 12px; font-weight: bold; border-radius: 6px; border: 3px solid var(--ui-frame); cursor: pointer; color: white; }
    </style>
</head>
<body>
    <div class="nav-row"><button class="back-btn" onclick="location.href='../../index.html'">◀ MAP HUB</button></div>
    <div class="game-box">
        <h2 style="font-size: 1.2rem; margin-bottom: 12px; text-transform: uppercase;">🧋 Pixel Boba Lab</h2>
        <div class="order-ticket" id="order-box">Awaiting request...</div>
        <div class="cup-container">
            <div id="liquid-layer" class="liquid"></div>
            <div id="boba-canvas" class="boba-canvas"></div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tea')">🍃 Teas</button>
            <button class="tab-btn" onclick="switchTab('milk')">🥛 Milks</button>
            <button class="tab-btn" onclick="switchTab('flavor')">🍯 Syrups</button>
            <button class="tab-btn" onclick="switchTab('topping')">⚫ Toppings</button>
        </div>
        <div class="ingredients-grid" id="ingredients-grid"></div>
        <div class="action-bar">
            <button style="background: #e74c3c;" onclick="resetCup()">RESET 🗑️</button>
            <button style="background: #2ecc71;" onclick="serveDrink()">SERVE ✔️</button>
        </div>
    </div>
    <script>
        const menu = {
            tea: [{name:'Matcha Green', color:'#7cb342'}, {name:'Thai Black', color:'#e67e22'}, {name:'Oolong Jade', color:'#d4a373'}, {name:'Earl Grey', color:'#8b5a2b'}],
            milk: [{name:'Oat Milk', color:'#f4ebd9'}, {name:'Almond Milk', color:'#fff5e6'}, {name:'Whole Milk', color:'#f8f9fa'}],
            flavor: [{name:'Brown Sugar', color:'#4a3525'}, {name:'Taro Purple', color:'#c3a6cb'}, {name:'Strawberry', color:'#ffb3ba'}],
            topping: [{name:'Tapioca Pearls', key:'tapioca'}, {name:'Popping Boba', key:'popping'}, {name:'Lychee Jelly', key:'lychee'}, {name:'Red Bean', key:'bean'}]
        };
        const pixelVectors = {
            tapioca: `<svg viewBox="0 0 8 8"><path d="M2,0 H6 V1 H7 V5 H6 V6 H2 V5 H1 V1 H2 Z" fill="#1e272e" stroke="#2d3436" stroke-width="0.5"/><circle cx="3.5" cy="2.5" r="1" fill="#718093"/></svg>`,
            popping: `<svg viewBox="0 0 8 8"><path d="M2,0 H6 V1 H7 V5 H6 V6 H2 V5 H1 V1 H2 Z" fill="#ff4757" stroke="#2d3436" stroke-width="0.5"/><circle cx="3.5" cy="2.5" r="1" fill="#ff7675"/></svg>`,
            lychee:  `<svg viewBox="0 0 8 8"><rect x="1" y="1" width="6" height="6" fill="#f1f2f6" stroke="#2d3436" stroke-width="1"/><rect x="2" y="2" width="2" height="2" fill="#ffffff"/></svg>`,
            bean:    `<svg viewBox="0 0 8 8"><path d="M1,2 H5 V3 H6 V5 H4 V6 H2 V5 H1 Z" fill="#c0392b" stroke="#2d3436" stroke-width="0.5"/><path d="M2,3 H4 V4 H2 Z" fill="#e74c3c"/></svg>`
        };
        let currentOrder = {}, playerSelection = { tea: '', milk: '', flavor: '', topping: '' }, activeTab = 'tea';

        function generateOrder() {
            currentOrder = {
                tea: menu.tea[Math.floor(Math.random()*menu.tea.length)].name,
                milk: menu.milk[Math.floor(Math.random()*menu.milk.length)].name,
                flavor: menu.flavor[Math.floor(Math.random()*menu.flavor.length)].name,
                topping: menu.topping[Math.floor(Math.random()*menu.topping.length)].name
            };
            document.getElementById('order-box').innerHTML = `• BASE: ${currentOrder.tea}<br>• CREAM: ${currentOrder.milk}<br>• SWIRL: ${currentOrder.flavor}<br>• TOP: ${currentOrder.topping}`;
        }
        function renderIngredients() {
            const grid = document.getElementById('ingredients-grid'); grid.innerHTML = '';
            menu[activeTab].forEach(item => {
                const btn = document.createElement('button'); btn.className = 'ing-btn'; btn.innerText = item.name;
                btn.onclick = () => {
                    playerSelection[activeTab] = item.name;
                    if(activeTab !== 'topping') {
                        const liq = document.getElementById('liquid-layer'); liq.style.height = "75%"; liq.style.backgroundColor = item.color;
                    } else { generatePixelToppings(item.key); }
                };
                grid.appendChild(btn);
            });
        }
        function switchTab(tab) { activeTab = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(tab.substring(0,3)))); renderIngredients(); }
        function generatePixelToppings(key) {
            const canvas = document.getElementById('boba-canvas'); canvas.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const node = document.createElement('div'); node.classList.add('pixel-garnish'); node.innerHTML = pixelVectors[key];
                let rX = Math.floor(Math.random() * 95) + 15;
                let layerY = i > 10 ? 150 : (i > 5 ? 162 : 173);
                node.style.left = `${rX}px`; node.style.top = `${layerY + (Math.random()*6-3)}px`;
                canvas.appendChild(node);
            }
        }
        function resetCup() { playerSelection = { tea:'', milk:'', flavor:'', topping:'' }; document.getElementById('liquid-layer').style.height = "0%"; document.getElementById('boba-canvas').innerHTML = ''; }
        function serveDrink() {
            if(playerSelection.tea===currentOrder.tea && playerSelection.milk===currentOrder.milk && playerSelection.flavor===currentOrder.flavor && playerSelection.topping===currentOrder.topping) {
                alert("✨ Perfect Mix! +20 Tokens!");
            } else { alert("❌ Wrong recipe blend."); }
            resetCup(); generateOrder();
        }
        generateOrder(); renderIngredients();
    </script>
</body>
</html>
