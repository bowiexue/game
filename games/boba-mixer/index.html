<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Boba Lab</title>
    <!-- Links your overhauled industrial console stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTROL HEADER ROW -->
    <!-- FIXED HEADER SYSTEM: Splits title and back button so nothing overlaps or disappears -->
<!-- FIXED PAS-TEL NAVIGATION HEADER SYSTEM -->
<div class="nav-row" style="display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 920px; width: 100%; padding: 0 10px; margin-bottom: 20px;">
    
    <!-- 1. Centered Café Title Label Area -->
    <div style="font-size: 1.8rem; text-transform: uppercase; color: #5c4a45; font-weight: 900; letter-spacing: 0.5px; text-align: center; text-shadow: 2px 2px 0 #ffffff;">
        Automated Brewing Grid
    </div>
    
    <!-- 2. Left-Aligned Thick Pastel Button Container -->
    <div style="width: 100%; display: flex; justify-content: flex-start;">
        <button onclick="location.href='../../index.html'" style="
            background: #ffadad; 
            color: #5c4a45; 
            border: 4px solid #5c4a45; 
            padding: 8px 24px; 
            border-radius: 12px; 
            font-size: 1.4rem; 
            font-weight: 900; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #5c4a45; 
            text-transform: uppercase;
            transition: all 0.05s ease-in-out;
        " onmousedown="this.style.transform='translateY(4px)', this.style.boxShadow='0 2px 0 #5c4a45'" onmouseup="this.style.transform='none', this.style.boxShadow='0 6px 0 #5c4a45'">
            ◀ MAP HUB
        </button>
    </div>

</div>



    <!-- MAIN CONSOLE DUAL-PANEL CHASSIS -->
    <div class="game-box">
        
        <!-- ========================================================
             LEFT CONSOLE PANEL: CRT DISPLAY & MONITOR GRAPHICS
             ======================================================== -->
        <div class="left-screen-bay" style="display: flex; flex-direction: column; justify-content: space-between;">
            
            <!-- Live Order Readout Ticket -->
            <div class="order-ticket">
                <!-- Populated dynamically via script logic -->
                Awaiting request...
            </div>

            <!-- Automated Core Mixing Dome Cylinder -->
            <div id="cooking-appliance-frame" class="cup-container">
                <div class="pot-contents" id="pot-contents" style="position: relative; width: 100%; height: 100%;">
                    <!-- Liquid Filling Layer Canvas mesh -->
                    <div class="liquid"></div>
                    <!-- Garnishes canvas layer slot wrapper -->
                    <div class="boba-canvas" id="soup-bubble-layer"></div>
                </div>
            </div>

            <!-- Terminal State Status readouts bar ribbon -->
            <div id="blend-status-banner" style="font-size: 1.4rem; padding: 6px; text-align: center; background: #11141a; border: 3px solid #2b3640; border-radius: 8px;">
                Awaiting brew sequence...
            </div>
            
        </div>

        <!-- ========================================================
             RIGHT CONSOLE PANEL: ROUTER PANEL & VALVE SWITCHES
             ======================================================== -->
        <div class="right-control-bay" style="display: flex; flex-direction: column; gap: 15px;">
            
            <!-- Ingredient Category Navigation tabs drawer -->
            <nav class="tabs">
                <button class="tab-btn active" onclick="toggleTabMode('teas')">Teas</button>
                <button class="tab-btn" onclick="toggleTabMode('milks')">Milks</button>
                <button class="tab-btn" onclick="toggleTabMode('syrups')">Syrups</button>
                <button class="tab-btn" onclick="toggleTabMode('toppings')">Toppings</button>
            </nav>

            <!-- Interactive Core Nodes Button Grid -->
            <div class="ingredients-grid">
                <!-- Dynamically populated drawer options based on active tab -->
            </div>

            <!-- SIDEBAR CHAMBER METRIC VITALS TRACKER GRID CONTAINER -->
            <div class="added-ingredients-tracker" style="height: auto; border-radius: 12px; border: 4px solid #2b3640; padding: 12px; background: #11141a;">
                <h4 style="font-size: 1.1rem; border-bottom: 2px dashed #2b3640; padding-bottom: 4px; margin-bottom: 6px; color: #a5b1c2;">📋 ROUTED INTENTS MATRIX</h4>
                <div class="tracker-pills-list" id="tracker-pills-list">
                    <div style="font-size:1.1rem; color:#a0a5ab; font-style:italic; padding:10px;">Chamber empty...</div>
                </div>
            </div>

            <!-- HEAVY MECHANICAL ACTION FOOTER SWITCH BAR -->
            <div class="action-bar">
                <!-- Flush Circuits command block selector -->
                <button onclick="clearMachineChamber()">Flush 🗑️</button>
                <!-- Centrifuge Shaker Engine Activation core selector -->
                <button onclick="compilePotRecipe()">Brew ✔</button>
            </div>
            
        </div>

    </div>

    <!-- THREE-PART MODULAR SOURCE SCRIPTS LINKAGE SYSTEM -->
    <script src="script.js"></script>
</body>
</html>
