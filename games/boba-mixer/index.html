<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Boba Lab</title>
    <!-- Links to your separate style sheet file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-row">
        <button class="back-btn" onclick="location.href='../../index.html'">◀ MAP HUB</button>
    </div>

    <div class="game-box">
        <h2 style="font-size: 2.5rem; margin-bottom: 15px; text-transform: uppercase; color: var(--ui-frame);">🧋 Pixel Boba Lab</h2>
        <div class="order-ticket" id="order-box">Awaiting request...</div>
        
        <div class="cup-container">
            <div id="liquid-layer" class="liquid"></div>
            <div id="boba-canvas" class="boba-canvas"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tea')">Teas</button>
            <button class="tab-btn" onclick="switchTab('milk')">Milks</button>
            <button class="tab-btn" onclick="switchTab('flavor')">Syrups</button>
            <button class="tab-btn" onclick="switchTab('topping')">Toppings</button>
        </div>

        <div class="ingredients-grid" id="ingredients-grid"></div>

        <div class="action-bar">
            <button style="background: #e74c3c; box-shadow: 0 4px 0 #b03a2e;" onclick="resetCup()">RESET 🗑️</button>
            <button style="background: #2ecc71; box-shadow: 0 4px 0 #27ae60;" onclick="serveDrink()">SERVE ✔️</button>
        </div>
    </div>

    <script>
        const menu = {
            tea: [{name:'Matcha Green', color:'#7cb342'}, {name:'Thai Black', color:'#e67e22'}, {name:'Oolong Jade', color:'#d4a373'}, {name:'Earl Grey', color:'#8b5a2b'}],
            milk: [{name:'Oat Milk', color:'#f4ebd9'}, {name:'Almond Milk', color:'#fff5e6'}, {name:'Whole Milk', color:'#f8f9fa'}],
            flavor: [{name:'Brown Sugar', color:'#4a3525'}, {name:'Taro Purple', color:'#c3a6cb'}, {name:'Strawberry', color:'#ffb3ba'}],
            topping: [{name:'Tapioca Pearls', key:'tapioca'}, {name:'Popping Boba', key:'popping'}, {name:'Lychee Jelly', key:'lychee'}, {name:'Red Bean', key:'bean'}]
        };

        const pixelVectors = {
            tapioca: `<svg viewBox="0 0 8 8"><path d="M2,0 H6 V1 H7 V5 H6 V6 H2 V5 H1 V1 H2 Z" fill="#1e272e" stroke="#2d3436" stroke-width="0.5"/><circle cx="3.5" cy="2.5" r="1" fill="#718093"/></svg>`,
            popping: `<svg viewBox="0 0 8 8"><path d="M2,0 H6 V1 H7 V5 H6 V6 H2 V5 H1 V1 H2 Z" fill="#ff4757" stroke="#2d3436" stroke-width="0.5"/><circle cx="3.5" cy="2.5" r="1" fill="#ff7675"/></svg>`,
            lychee:  `<svg viewBox="0 0 8 8"><rect x="1" y="1" width="6" height="6" fill="#f1f2f6" stroke="#2d3436" stroke-width="1"/><rect x="2" y="2" width="2" height="2" fill="#ffffff"/></svg>`,
            bean:    `<svg viewBox="0 0 8 8"><path d="M1,2 H5 V3 H6 V5 H4 V6 H2 V5 H1 Z" fill="#c0392b" stroke="#2d3436" stroke-width="0.5"/><path d="M2,3 H4 V4 H2 Z" fill="#e74c3c"/></svg>`
        };

        let currentOrder = {}, playerSelection = { tea: '', milk: '', flavor: '', topping: '' }, activeTab = 'tea';

        function generateOrder() {
            currentOrder = {
                tea: menu.tea[Math.floor(Math.random()*menu.tea.length)].name,
                milk: menu.milk[Math.floor(Math.random()*menu.milk.length)].name,
                flavor: menu.flavor[Math.floor(Math.random()*menu.flavor.length)].name,
                topping: menu.topping[Math.floor(Math.random()*menu.topping.length)].name
            };
            document.getElementById('order-box').innerHTML = `• BASE: ${currentOrder.tea}<br>• CREAM: ${currentOrder.milk}<br>• SWIRL: ${currentOrder.flavor}<br>• TOP: ${currentOrder.topping}`;
        }

        function renderIngredients() {
            const grid = document.getElementById('ingredients-grid');
            grid.innerHTML = '';
            menu[activeTab].forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'ing-btn';
                btn.innerText = item.name;
                btn.onclick = () => {
                    playerSelection[activeTab] = item.name;
                    if(activeTab !== 'topping') {
                        const liq = document.getElementById('liquid-layer');
                        liq.style.height = "75%";
                        liq.style.backgroundColor = item.color;
                    } else {
                        generatePixelToppings(item.key);
                    }
                };
                grid.appendChild(btn);
            });
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(tab.substring(0,3))));
            renderIngredients();
        }

        function generatePixelToppings(key) {
            const canvas = document.getElementById('boba-canvas');
            canvas.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const node = document.createElement('div');
                node.classList.add('pixel-garnish');
                node.innerHTML = pixelVectors[key];
                let rX = Math.floor(Math.random() * 85) + 18;
                let layerY = i > 10 ? 142 : (i > 5 ? 152 : 160);
                node.style.left = `${rX}px`;
                node.style.top = `${layerY + (Math.random()*6-3)}px`;
                canvas.appendChild(node);
            }
        }

        function resetCup() {
            playerSelection = { tea:'', milk:'', flavor:'', topping:'' };
            document.getElementById('liquid-layer').style.height = "0%";
            document.getElementById('boba-canvas').innerHTML = '';
        }

        function serveDrink() {
            if(playerSelection.tea===currentOrder.tea && playerSelection.milk===currentOrder.milk && playerSelection.flavor===currentOrder.flavor && playerSelection.topping===currentOrder.topping) {
                alert("✨ Perfect Mix! +20 Tokens!");
                // Earn currency in LocalStorage
                let tokens = parseInt(localStorage.getItem('hub_tokens') || 100) + 20;
                localStorage.setItem('hub_tokens', tokens);
            } else {
                alert("❌ Wrong recipe blend.");
            }
            resetCup();
            generateOrder();
        }

        generateOrder();
        renderIngredients();
    </script>
</body>
</html>
