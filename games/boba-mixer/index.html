<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Doodle Boba Mixer</title>
    <style>
        :root { --boba-earth: #f39c12; --boba-cup: #34495e; }
        * { box-sizing: border-box; font-family: 'Century Gothic', sans-serif; margin: 0; padding: 0; }
        body { background: #ffeaa7; color: #2d3436; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .game-frame { background: #ffffff; border: 6px solid var(--boba-cup); border-radius: 28px; padding: 25px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 10px 0px rgba(0,0,0,0.05); }
        .back-btn { background: #718093; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; float: left; }
        
        .customer-card { background: #f9f9f9; padding: 12px; border-radius: 12px; border: 3px solid #dfe6e9; font-weight: bold; margin: 20px 0; font-size: 1.1rem; }
        
        /* Accurate Fluid Hydrometer Display Core */
        .glass-zone { display: flex; justify-content: center; position: relative; margin: 30px 0; }
        .glass { width: 150px; height: 260px; border: 5px solid var(--boba-cup); border-top: none; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; position: relative; overflow: hidden; background: #fff; display: flex; flex-direction: column-reverse; }
        
        .fluid-mass { width: 100%; height: 0%; transition: height 0.05s linear; }
        #fill-pearls { background: #2d3436; background-image: radial-gradient(#636e72 20%, transparent 20%); background-size: 12px 12px; }
        #fill-tea { background: #ccae78; }
        #fill-milk { background: #fbf6ec; }
        
        /* Calibration Precision Line Markers */
        .target-marker { position: absolute; left: 130px; width: 180px; border-top: 4px dashed #ff7675; z-index: 10; font-size: 0.8rem; font-weight: bold; color: #ff7675; text-align: right; padding-right: 5px; pointer-events: none; }
        #marker-1 { bottom: calc(260px * 0.25); } /* 25% Line */
        #marker-2 { bottom: calc(260px * 0.75); } /* 75% Line */
        
        .pump-deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .valve-btn { background: #6c5ce7; color: white; border: 3px solid var(--boba-cup); padding: 12px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-shadow: 0 4px 0 var(--boba-cup); }
        .valve-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="game-frame">
        <button class="back-btn" onclick="location.href='../../index.html'">⬅ Hub</button>
        <h2 style="font-size:1.8rem; clear:both; margin-top:10px;">🧋 Bubble Tea Creator</h2>
        <p style="font-size:0.85rem; color:#7f8c8d;">Hold buttons down to open the valves and fill the cup precisely to the target lines!</p>

        <div class="customer-card">
            🎯 Order Guide Lines:<br>
            <span style="color:#2d3436">Fill Pearls to Line 1 ➔ Fill Tea to Line 2 ➔ Fill Milk to Top</span>
        </div>

        <div class="glass-zone">
            <!-- Target Alignment Lines -->
            <div class="target-marker" id="marker-1">── Line 1 (Pearls)</div>
            <div class="target-marker" id="marker-2">── Line 2 (Tea)</div>
            
            <div class="glass">
                <div class="fluid-mass" id="fill-milk"></div>
                <div class="fluid-mass" id="fill-tea"></div>
                <div class="fluid-mass" id="fill-pearls"></div>
            </div>
        </div>

        <div style="font-weight: bold;">Current Volume Fill: <span id="monitor">0</span>%</div>

        <!-- hold down triggers continuous volumetric pump additions -->
        <div class="pump-deck">
            <button class="valve-btn" style="background:#2d3436;" onmousedown="startPour('pearls')" onmouseup="stopPour()" onmouseleave="stopPour()">⚫ Pearls</button>
            <button class="valve-btn" style="background:#eccc68; color:#2f3640;" onmousedown="startPour('tea')" onmouseup="stopPour()" onmouseleave="stopPour()">🍵 Tea Base</button>
            <button class="valve-btn" style="background:#f1f2f6; color:#2f3640;" onmousedown="startPour('milk')" onmouseup="stopPour()" onmouseleave="stopPour()">🥛 Milk</button>
        </div>

        <button onclick="gradeMix()" style="width:100%; margin-top:15px; padding:12px; background:#2ecc71; border:3px solid var(--boba-cup); border-radius:16px; font-weight:bold; font-size:1.1rem; cursor:pointer; color:white; box-shadow:0 4px 0 var(--boba-cup);">🛎️ Check Recipe Grade</button>
    </div>

    <script>
        let recipe = { pearls: 0, tea: 0, milk: 0 };
        let pourEngine = null;

        function startPour(type) {
            if(pourEngine) clearInterval(pourEngine);
            pourEngine = setInterval(() => {
                let total = recipe.pearls + recipe.tea + recipe.milk;
                if(total >= 100) { stopPour(); return; }
                
                recipe[type] += 1;
                document.getElementById(`fill-${type}`).style.height = recipe[type] + "%";
                document.getElementById('monitor').innerText = total + 1;
            }, 30); // Dynamic line fill scale updates
        }

        function stopPour() {
            clearInterval(pourEngine);
            pourEngine = null;
        }

        function gradeMix() {
            stopPour();
            // Google Doodle targets: 25% Pearls, 50% Tea (totaling 75%), 25% Milk (totaling 100%)
            let error1 = Math.abs(recipe.pearls - 25);
            let error2 = Math.abs((recipe.pearls + recipe.tea) - 75);
            let totalError = error1 + error2;

            if(recipe.pearls + recipe.tea + recipe.milk < 90) {
                alert("⭐ Cup is too empty! Keep filling to serve a full glass.");
            } else if(totalError <= 6) {
                alert("🌟 Perfect 3-Star Match! You poured directly on the lines!");
            } else if(totalError <= 15) {
                alert("⭐ Good 2-Star Mix! Very close to the lines.");
            } else {
                alert("❌ 1-Star. Your layers missed the target lines. Resetting cup to try again!");
            }
            
            // Wipe slate clean
            recipe = { pearls: 0, tea: 0, milk: 0 };
            document.getElementById('fill-pearls').style.height = "0%";
            document.getElementById('fill-tea').style.height = "0%";
            document.getElementById('fill-milk').style.height = "0%";
            document.getElementById('monitor').innerText = 0;
        }
    </script>
</body>
</html>
